[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "uniform-passwords"
version = "0.1.0"
description = "Uniformly constrained password generator"
readme = "README.md"
license = "MIT"
authors = [{ name = "otrumb" }]
keywords = ["cli", "password", "security", "uniform-sampling", "utility", "windows", "linux"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
uniform-passwords = "uniform_passwords.cli:main"

[project.urls]
Repository = "https://github.com/otrumb/uniform-passwords"
Issues = "https://github.com/otrumb/uniform-passwords/issues"

[dependency-groups]
dev = [
  "basedpyright>=1.31.4",
  "build>=1.3.0",
  "hatchling>=1.27.0",
  "pytest>=8.4.2",
  "ruff>=0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uniform_passwords"]

[tool.hatch.build.targets.sdist]
include = [
  "/.gitattributes",
  "/.github/workflows/ci.yml",
  "/.gitignore",
  "/.python-version",
  "/CHANGELOG.md",
  "/LICENSE",
  "/PROVENANCE.md",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/src/uniform_passwords",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "PT011", "S101", "SLF001"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "build", "dist"]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "all"
reportAny = "error"
reportExplicitAny = "error"
reportIgnoreCommentWithoutRule = "error"
reportImportCycles = "error"
reportMissingSuperCall = "error"
reportPrivateUsage = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUninitializedInstanceVariable = "error"
reportUnusedCallResult = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
